apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-matcher-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "job-matcher-ip"
    networking.gke.io/managed-certificates: "job-matcher-cert"
    networking.gke.io/v1beta1.FrontendConfig: "job-matcher-frontend-config"
spec:
  rules:
  - host: job-matcher.manukraut.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
