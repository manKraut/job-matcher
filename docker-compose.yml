version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OPEN_API_KEY=${OPEN_API_KEY}

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    stdin_open: true
    tty: true